version: 2

models:
  - name: route_summary
    description: "One row per route/carrier/quarter, combining on-time performance and fare data. Grain matches the join limitation between fact_flights and fact_fares — flight-level and fare-level data can only be joined at this aggregated grain, not per-flight."
    columns:
      - name: Year
        tests:
          - not_null
      - name: total_flights
        description: "Count of individual flights aggregated into this route/carrier/quarter."
        tests:
          - not_null
      - name: pct_delayed_15
        description: "Fraction of flights delayed 15+ minutes at departure."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: avg_fare
        description: "Average fare for this route/carrier/quarter, after outlier and sub-$25 filtering applied during ingestion. NULL where DB1B's 10% sample had no matching tickets for a given route/carrier/quarter — this is a known, documented sampling gap, not missing data to be imputed."
